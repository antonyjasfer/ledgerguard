[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ledgerguard"
version = "0.1.0"
description = "Autonomous Accounts Payable invoice verification agent powered by Strands Agents SDK."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "strands-agents>=1.54.0",
    "boto3>=1.43.86",
    "openai>=3.8.0",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.3",
    "aws-bedrock-token-generator>=1.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
