[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ledgerguard"
version = "0.1.0"
description = "Autonomous Accounts Payable invoice verification agent powered by Strands Agents SDK."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.3",
    "python-multipart>=0.0.9",
    "argon2-cffi>=23.1.0",
    "boto3>=1.43.86",
    "strands-agents>=1.54.0",
    "openai>=3.8.0",
    "pypdf>=4.0.0",
    "httpx>=0.27.0",
    "aws-bedrock-token-generator>=1.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "connectors*", "api*"]
exclude = ["tests*", "frontend*", "data*", "demo_batch*", "skills*", "open_source_contribution*", "scripts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
markers = ["integration: mark test as requiring live AWS integration"]